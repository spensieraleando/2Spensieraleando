<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEPHOTODIALE</title>
<style>
  :root {
    --bg: #FFFFFF;
    --ink: #111111;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .layout {
    display: flex;
    min-height: 100vh;
  }

  /* Sidebar nav */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    padding: 6vh 24px;
  }

  .sidebar .logo {
    display: block;
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--ink);
    text-decoration: none;
    margin-bottom: 5vh;
  }

  .sidebar ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .sidebar li {
    margin-bottom: 0.9em;
  }

  .sidebar a {
    color: var(--ink);
    text-decoration: none;
    font-size: 0.95rem;
  }

  .sidebar a:hover,
  .sidebar a:focus-visible {
    text-decoration: underline;
  }

  .sidebar a.current {
    font-weight: 700;
  }

  /* Main content */
  main {
    flex: 1;
    padding: 6vh 48px 10vh;
  }

  h1 {
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 900;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    margin: 0;
  }

  a {
    color: var(--ink);
  }

  @media (max-width: 720px) {
    .layout {
      flex-direction: column;
    }
    .sidebar {
      width: 100%;
      padding: 4vh 20px;
    }
    .sidebar .logo {
      margin-bottom: 3vh;
    }
    main {
      padding: 5vh 20px 8vh;
    }
  }
</style>
</head>
<body>

<div class="layout">
  <nav class="sidebar">
    <a href="index.html" class="logo">LEPHOTODIALE</a>
    <ul>
      <li><a href="index.html">London</a></li>
      <li><a href="index.html">Edinburgh</a></li>
      <li><a href="index.html">Canary Island</a></li>
      <li><a href="index.html">Gallery</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </nav>

  <main>
    <h1>LEPHOTODIALE</h1>
    <!-- photos will go here later -->
  </main>
</div>

</body>
</html>
