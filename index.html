<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEPHOTODIALE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@700&display=swap" rel="stylesheet">

<!-- Cloudinary Gallery -->
<script
  src="https://product-gallery.cloudinary.com/latest/all.js"
  type="text/javascript">
</script>

<style>
  :root {
    --bg: #FFFFFF;
    --ink: #111111;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .layout {
    display: flex;
    min-height: 100vh;
  }

  /* Sidebar nav */
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    padding: 8vh 24px 8vh 64px;
  }

  .sidebar .logo {
    display: block;
    font-family: "Work Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 27px;
    font-weight: 700;
    line-height: 1.2em;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    color: var(--ink);
    text-decoration: none;
    margin-bottom: 6vh;
  }

  .sidebar ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .sidebar li {
    margin-bottom: 0.9em;
  }

  .sidebar a {
    color: var(--ink);
    text-decoration: none;
    font-size: 0.95rem;
  }

  .sidebar a:hover,
  .sidebar a:focus-visible {
    text-decoration: underline;
  }

  .sidebar a.current {
    font-weight: 700;
  }

  /* Main content */
  main {
    flex: 1;
    padding: 6vh 48px 10vh;
  }

  /* Cloudinary gallery */
  #my-gallery {
    width: 100%;
  }

  h1 {
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 900;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    margin: 0;
  }

  a {
    color: var(--ink);
  }

  @media (max-width: 720px) {
    .layout {
      flex-direction: column;
    }

    .sidebar {
      width: 100%;
      padding: 4vh 20px;
    }

    .sidebar .logo {
      margin-bottom: 3vh;
    }

    main {
      padding: 5vh 20px 8vh;
    }
  }
</style>
</head>

<body>

<div class="layout">

  <nav class="sidebar">
    <a href="index.html" class="logo">LEPHOTODIALE</a>

    <ul>
      <li><a href="index.html" class="current">London</a></li>
      <li><a href="edinburgh.html">Edinburgh</a></li>
      <li><a href="canary-island.html">Canary Island</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </nav>

  <main>

    <!-- Your Cloudinary London photos appear here -->
    <div id="my-gallery"></div>

  </main>

</div>

<script>
  const myGallery = cloudinary.galleryWidget({
    container: "#my-gallery",

    cloudName: "ftkp5vrp",

    mediaAssets: [
      {
        tag: "London",
        mediaType: "image"
      }
    ],

    displayProps: {
      mode: "classic",
      spacing: 10
    },

    thumbnailProps: {
      width: 120,
      height: 120
    }
  });

  myGallery.render();
</script>

</body>
</html>
