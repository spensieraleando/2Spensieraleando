<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEPHOTODIALE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #FFFFFF;
    --ink: #111111;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .layout {
    display: flex;
    min-height: 100vh;
  }

  /* LEFT SIDEBAR */

  .sidebar {
    width: 240px;
    flex-shrink: 0;
    padding: 8vh 24px 8vh 64px;
  }

  .sidebar .logo {
    display: block;
    font-family: "Work Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 27px;
    font-weight: 700;
    line-height: 1.2em;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    color: var(--ink);
    text-decoration: none;
    margin-bottom: 6vh;
  }

  .sidebar ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .sidebar li {
    margin-bottom: 0.9em;
  }

  .sidebar a {
    color: var(--ink);
    text-decoration: none;
    font-size: 0.95rem;
  }

  .sidebar a:hover,
  .sidebar a:focus-visible {
    text-decoration: underline;
  }

  .sidebar a.current {
    font-weight: 700;
  }


  /* MAIN PHOTO AREA */

  main {
    flex: 1;
    min-width: 0;
    padding: 5vw 7vw 4vw 3vw;

    display: flex;
    flex-direction: column;
    justify-content: center;
  }


  /* SINGLE PHOTO */

  .photo-frame {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;

    min-height: 70vh;
  }

  #main-photo {
    display: block;

    width: 100%;
    max-width: 1000px;
    max-height: 76vh;

    object-fit: contain;

    cursor: pointer;

    transition: opacity 0.25s ease;
  }


  /* PREV / NEXT */

  .navigation {
    margin-top: 22px;
    display: flex;
    gap: 6px;

    font-size: 0.7rem;
    text-transform: uppercase;
  }

  .navigation button {
    border: 0;
    background: none;
    padding: 0;

    color: var(--ink);
    font-family: inherit;
    font-size: inherit;

    cursor: pointer;
  }

  .navigation button:hover {
    text-decoration: underline;
  }


  /* MOBILE */

  @media (max-width: 720px) {

    .layout {
      flex-direction: column;
    }

    .sidebar {
      width: 100%;
      padding: 4vh 20px;
    }

    .sidebar .logo {
      margin-bottom: 3vh;
    }

    main {
      padding: 20px;
    }

    .photo-frame {
      min-height: auto;
    }

    #main-photo {
      max-height: 70vh;
    }
  }
</style>
</head>

<body>

<div class="layout">

  <!-- LEFT NAVIGATION -->

  <nav class="sidebar">

    <a href="index.html" class="logo">
      LEPHOTODIALE
    </a>

    <ul>
      <li><a href="index.html" class="current">London</a></li>
      <li><a href="edinburgh.html">Edinburgh</a></li>
      <li><a href="canary-island.html">Canary Island</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="about.html">About</a></li>
    </ul>

  </nav>


  <!-- MAIN PHOTO -->

  <main>

    <div class="photo-frame">
      <img
        id="main-photo"
        src=""
        alt="Street photography"
      >
    </div>

    <div class="navigation">
      <button id="prev-button">PREV</button>
      <span>/</span>
      <button id="next-button">NEXT</button>
    </div>

  </main>

</div>


<script>

  const cloudName = "ftkp5vrp";
  const tagName = "London";

  let photos = [];
  let currentPhoto = 0;

  const image = document.getElementById("main-photo");
  const previousButton = document.getElementById("prev-button");
  const nextButton = document.getElementById("next-button");


  /* LOAD ALL PHOTOS TAGGED "London" FROM CLOUDINARY */

  fetch(
    `https://res.cloudinary.com/${cloudName}/image/list/${tagName}.json`
  )
    .then(response => {

      if (!response.ok) {
        throw new Error("Could not load photos");
      }

      return response.json();
    })

    .then(data => {

      photos = data.resources;

      if (photos.length === 0) {
        image.alt = "No London photos available";
        return;
      }

      showPhoto();

    })

    .catch(error => {
      console.error(error);
      image.alt = "Could not load photos";
    });


  /* SHOW CURRENT PHOTO */

  function showPhoto() {

    image.style.opacity = "0";

    setTimeout(() => {

      image.src = photos[currentPhoto].secure_url;

      image.onload = function() {
        image.style.opacity = "1";
      };

    }, 150);

  }


  /* NEXT PHOTO */

  function nextPhoto() {

    currentPhoto++;

    if (currentPhoto >= photos.length) {
      currentPhoto = 0;
    }

    showPhoto();

  }


  /* PREVIOUS PHOTO */

  function previousPhoto() {

    currentPhoto--;

    if (currentPhoto < 0) {
      currentPhoto = photos.length - 1;
    }

    showPhoto();

  }


  /* BUTTONS */

  nextButton.addEventListener("click", nextPhoto);

  previousButton.addEventListener("click", previousPhoto);


  /* CLICKING THE PHOTO ALSO GOES TO THE NEXT ONE */

  image.addEventListener("click", nextPhoto);

</script>

</body>
</html>
